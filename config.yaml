# Upstream sources and generated rule sets.
# Add per-service overrides in rules/<slug>/custom.list.
# Shared infrastructure rules are maintained separately in rules/_global/.

upstream:
  metacubex:
    repo: MetaCubeX/meta-rules-dat
    branch: meta

rules:
  # AI services.
  - name: OpenAI
    description: ChatGPT / OpenAI API / Sora
    upstream: metacubex
    paths:
      - geo/geosite/openai.list

  - name: Claude
    description: Anthropic Claude
    upstream: metacubex
    paths:
      - geo/geosite/anthropic.list

  - name: Gemini
    description: Google Gemini AI
    upstream: metacubex
    paths:
      - geo/geosite/google-gemini.list

  # Other AI services; shared third-party infrastructure belongs in ai-common.
  - name: AIOther
    description: Other AI services and custom additions
    upstream: metacubex
    paths:
      - geo/geosite/category-ai-!cn.list

  # Common services.
  - name: Google
    description: Google services
    upstream: metacubex
    paths:
      - geo/geosite/google.list

  - name: YouTube
    description: YouTube video services
    upstream: metacubex
    paths:
      - geo/geosite/youtube.list

  # Merge in this order; keep the slug stable when changing the display name.
  - name: Google Suite
    slug: GoogleSuite
    description: Google, Gemini and YouTube combined
    upstream: metacubex
    paths:
      - geo/geosite/google-gemini.list
      - geo/geosite/youtube.list
      - geo/geosite/google.list

  - name: Twitter
    description: X / Twitter
    upstream: metacubex
    paths:
      - geo/geosite/twitter.list

  - name: Telegram
    description: Telegram messaging
    upstream: metacubex
    paths:
      - geo/geosite/telegram.list

  - name: GitHub
    description: GitHub
    upstream: metacubex
    paths:
      - geo/geosite/github.list

  - name: Microsoft
    description: Microsoft services
    upstream: metacubex
    paths:
      - geo/geosite/microsoft.list

  - name: Netflix
    description: Netflix streaming
    upstream: metacubex
    paths:
      - geo/geosite/netflix.list

  - name: Spotify
    description: Spotify music
    upstream: metacubex
    paths:
      - geo/geosite/spotify.list

  # Select an egress appropriate for each service's regional availability.
  - name: Cryptocurrency
    description: Cryptocurrency exchanges (non-US egress)
    upstream: metacubex
    paths:
      - geo/geosite/category-cryptocurrency.list

  # Steam traffic and game download CDNs; intended for direct routing.
  # See rules/GameDownload/README.md for scope and custom additions.
  - name: GameDownload
    description: Steam, game download CDNs and PlayStation downloads
    upstream: metacubex
    paths:
      - geo/geosite/steam.list
      - geo/geosite/category-game-platforms-download.list
